name: sports_talent_assessment
description: AI-powered mobile platform for democratizing sports talent assessment

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^12.1.3
  
  # Camera & Vision
  camera: ^0.10.5+5
  google_mlkit_face_detection: ^0.10.0
  google_mlkit_pose_detection: ^0.12.0
  permission_handler: ^11.0.1
  
  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # State Management
  provider: ^6.1.1
  
  # Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # Image Processing
  image: ^4.1.3
  
  # HTTP & Networking
  http: ^1.1.2
  
  # Utilities
  path_provider: ^2.1.1
  intl: ^0.19.0
  connectivity_plus: ^6.0.5
  image_picker: ^1.1.2
  video_player: ^2.9.2
  tflite_flutter: ^0.11.0
  video_thumbnail: ^0.5.3
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/movenet_thunder.tflite
    - assets/face_landmark.tflite
  
